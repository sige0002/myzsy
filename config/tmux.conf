# WSL / Ubuntu, tmux 3.2 以降。配置先: ~/.tmux.conf
# WezTerm は表示、分割・ウィンドウ・セッション管理は tmux に集約。

# シェル。default-command を空にし、default-shell を使用する。
set -g default-shell /usr/bin/zsh
set -g default-command ''

# 基本設定
set -g history-limit 100000
set -g mouse on
set -sg escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-256color:RGB'
set -g focus-events on

# Prefix は Ctrl-b。以前の Ctrl-a 設定も解除する。
set -g prefix C-b
unbind C-a
bind C-b send-prefix
bind r source-file ~/.tmux.conf \; display-message 'tmux.conf reloaded'

# 分割: Ctrl-b の後に - または |。現在ディレクトリを維持する。
unbind '"'
unbind %
bind - split-window -v -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'

# Ctrl + 矢印でペイン移動。Prefix 不要。
bind -n C-Left  select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up    select-pane -U
bind -n C-Down  select-pane -D

# Ctrl-b の後、Shift + 矢印でサイズ変更。
bind -r S-Left  resize-pane -L 5
bind -r S-Right resize-pane -R 5
bind -r S-Up    resize-pane -U 5
bind -r S-Down  resize-pane -D 5

# ウィンドウ
bind c new-window -c '#{pane_current_path}'
bind n next-window
bind p previous-window

# Git リポジトリ内で使用する。終了すると追加したペイン等は閉じる。
# Ctrl-b g: 右側ペイン / Ctrl-b G: 新しいウィンドウ
bind g split-window -h -c '#{pane_current_path}' 'lazygit'
bind G new-window -n git -c '#{pane_current_path}' 'lazygit'

# コピー。Windows クリップボードへの明示的な連携は未設定。
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ステータス / タイトル
set -g status on
set -g status-interval 5
set -g status-left ' [#S] '
set -g status-right ' %Y-%m-%d %H:%M '
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W* '
set -g set-titles on
set -g set-titles-string '#S:#I.#P #W'
